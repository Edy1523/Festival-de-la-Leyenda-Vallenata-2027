<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Categorías - Festival Vallenato</title>
</head>
<body>
    <h1>Categorías en Competencia</h1>
    
    <ul>
        {% for categoria in categorias %}
            <li><strong>{{ categoria.nombre }}</strong>: {{ categoria.descripcion }}</li>
        {% empty %}
            <li>No hay categorías registradas en este momento.</li>
        {% endfor %}
    </ul>

    <a href="{% url 'votaciones:index' %}">⬅ Volver al inicio</a>
</body>
</html>
